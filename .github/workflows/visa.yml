name: Visa rules refresh (weekly)
on:
  push:
    paths: ['.github/workflows/visa.yml']
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: visa-refresh, cancel-in-progress: false }
jobs:
  visa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Rebuild visa files
        run: |
          set -o pipefail
          [ -f _tools/visa_build.py ] || { echo "waiting for the site upload"; exit 0; }
          curl -fsSL -o /tmp/p.csv https://raw.githubusercontent.com/imorte/passport-index-data/main/passport-index-tidy-iso2.csv
          python3 _tools/visa_build.py /tmp/p.csv _tools/visa-steps.json visa 2>&1 | tee /tmp/visa.log
      - name: Publish
        run: |
          git config user.name "dipmapper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A visa || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Visa rules: weekly refresh"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
