name: Data collector
on:
  push:
    paths: ['.github/workflows/data-collect.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-collect, cancel-in-progress: true }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Collect map positions and published contacts
        run: python3 _tools/collect.py
      - name: Save result
        run: |
          git config user.name "dipmapper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-collect.json
          git commit -m "Data collector result" || echo "no change"
          git pull --rebase -q || true
          git push
