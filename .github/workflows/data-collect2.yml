name: Data collector 2
on:
  push:
    paths: ['.github/workflows/data-collect2.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: data-collect2, cancel-in-progress: true }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Collect positions, piers and contacts (candidates for review)
        run: python3 _tools/collect2.py
      - name: Save result
        run: |
          git config user.name "dipmapper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-collect2.json
          git commit -m "Data collector 2 result" || echo "no change"
          git pull --rebase -q || true
          git push
