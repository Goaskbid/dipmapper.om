name: Sitemap
on:
  workflow_run:
    workflows: ['Deploy any uploaded DipMapper zip']
    types: [completed]
  push:
    paths: ['.github/workflows/sitemap.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: sitemap, cancel-in-progress: false }
jobs:
  sitemap:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Generate and validate sitemap.xml
        run: python3 _tools/sitemap.py .
      - name: Publish if changed
        run: |
          git config user.name "dipmapper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml robots.txt _tools/sitemap-state.json
          git diff --cached --quiet && { echo "sitemap unchanged"; exit 0; }
          git commit -m "Update sitemap.xml"
          git pull --rebase -q || true
          git push
