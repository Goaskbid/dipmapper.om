name: Water quality (EEA, self-reporting)
on:
  push:
    paths: ['.github/workflows/water.yml']
  workflow_run:
    workflows: ['Deploy any uploaded DipMapper zip']
    types: [completed]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: water-quality, cancel-in-progress: false }
jobs:
  water:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Need a run?
        id: chk
        run: |
          python3 - <<'PY'
          import json, os, datetime
          run = 'yes'
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_run' and os.path.exists('water/index.json'):
              run = 'no'
          if not os.path.exists('_tools/water_eea.py'):
              run = 'no'
          open(os.environ['GITHUB_OUTPUT'], 'a').write('run=%s\n' % run)
          PY
      - name: Fetch and tile
        if: steps.chk.outputs.run == 'yes'
        run: |
          set -o pipefail
          python3 _tools/water_eea.py water 2>&1 | tee /tmp/water.log
          du -sh water; ls water | wc -l
      - name: Publish result or diagnosis
        if: always() && steps.chk.outputs.run == 'yes'
        run: |
          python3 - <<'PY'
          import json, os, datetime
          log = open('/tmp/water.log').read()[-4000:] if os.path.exists('/tmp/water.log') else 'no log'
          ok = os.path.exists('water/index.json') and 'Traceback' not in log
          json.dump({'ok': ok, 'when': datetime.datetime.utcnow().isoformat() + 'Z', 'log_tail': log}, open('water-status.json', 'w'), indent=1)
          PY
          git config user.name "dipmapper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add water-status.json
          [ -f water/index.json ] && git add -A water || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Water quality: $(python3 -c "import json;print('published' if json.load(open('water-status.json'))['ok'] else 'diagnosis')")"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
